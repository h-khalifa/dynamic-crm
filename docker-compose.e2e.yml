# End-to-end tests in containers:
#   docker build -t dynamic-crm:prod .
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm e2e
services:
  web:
    image: dynamic-crm:prod
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm
      ROOT_DOMAIN: dcrm.test:3000
      APP_PROTOCOL: http
      SESSION_SECRET: e2e-only-secret-6b1f0c9e2d8a4f7b3c5e1a9d0f2b4c6e
    depends_on:
      db:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    working_dir: /app
    command: sh -c "node e2e/wait-for-web.mjs && npx playwright test"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - web
